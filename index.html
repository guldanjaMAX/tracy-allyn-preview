<script>
(function(){
'use strict';
var video=document.getElementById('hero-video');
var status=document.getElementById('motion-status');
var dialog=document.getElementById('quiz-dialog');
var quizOpen=document.getElementById('quiz-open');
var deviceQuery=window.matchMedia('(max-width:700px)');
var reducedQuery=window.matchMedia('(prefers-reduced-motion:reduce)');
var wantsMotion=!reducedQuery.matches;
var sourceVersion=0;
var sources={desktop:{film:'assets/videos/wild-and-rooted-desktop-veo31.mp4',poster:'assets/videos/05-wild-and-rooted.jpg'},phone:{film:'assets/videos/wild-and-rooted-mobile-veo31.mp4',poster:'assets/videos/05-wild-and-rooted-mobile.jpg'}};
video.muted=true;video.defaultMuted=true;video.playsInline=true;video.loop=true;
function showPoster(message){video.classList.remove('is-visible');if(message)status.textContent=message}
function play(){if(!wantsMotion||dialog.open||document.hidden)return;var thisVersion=sourceVersion;var result=video.play();if(result&&result.catch){result.catch(function(){if(thisVersion!==sourceVersion||dialog.open||document.hidden)return;wantsMotion=false;showPoster('The still portrait is shown because autoplay is unavailable.')})}}
function loadSource(){sourceVersion+=1;video.pause();video.classList.remove('is-visible');var source=deviceQuery.matches?sources.phone:sources.desktop;video.poster=source.poster;video.src=source.film;video.load();if(wantsMotion)play();else status.textContent=reducedQuery.matches?'Reduced motion is enabled. The still portrait is shown.':'Video paused.'}
video.addEventListener('playing',function(){if(!wantsMotion||dialog.open||document.hidden){video.pause();return}video.classList.add('is-visible');status.textContent='Background video playing.'});
video.addEventListener('error',function(){wantsMotion=false;showPoster('The still portrait is shown because the video is unavailable.')});
quizOpen.addEventListener('click',function(){video.pause();dialog.showModal()});
document.getElementById('quiz-close').addEventListener('click',function(){dialog.close()});
dialog.addEventListener('close',function(){quizOpen.focus();play()});
document.addEventListener('visibilitychange',function(){if(document.hidden)video.pause();else play()});
function reducedChanged(event){if(event.matches){wantsMotion=false;video.pause();showPoster('Reduced motion is enabled. The still portrait is shown.')}}
if(deviceQuery.addEventListener){deviceQuery.addEventListener('change',loadSource);reducedQuery.addEventListener('change',reducedChanged)}else{deviceQuery.addListener(loadSource);reducedQuery.addListener(reducedChanged)}
loadSource();
})();
</script>
